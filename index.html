
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Match Intelligence Pro</title>
<link rel="manifest" href="./manifest.json">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<header>
  <div class="logo">MI</div>
  <div>
    <h2>Match Intelligence Pro</h2>
    <small>SPORTS ANALYTICS PLATFORM</small>
  </div>
</header>

<main>
  <section class="welcome">
    <p>YOUR ANALYTICS CENTER</p>
    <h1>Welcome back!</h1>
    <span>Your multi-sport analytics dashboard.</span>
  </section>

  <section class="stats">
    <div><small>Historical matches</small><h2>0</h2></div>
    <div><small>Sports available</small><h2>3</h2></div>
    <div><small>Predictions saved</small><h2>0</h2></div>
  </section>

  <section class="panel">
    <h3>Choose your sport</h3>
    <div class="sports">
      <button onclick="selectSport('Cricket')">🏏<br>Cricket</button>
      <button onclick="selectSport('Football')">⚽<br>Football</button>
      <button onclick="selectSport('Tennis')">🎾<br>Tennis</button>
    </div>
    <p id="selected">Selected sport: Cricket</p>
  </section>

  <section class="panel">
    <h3>Application status</h3>
    <p id="status">Your dashboard is working.</p>
  </section>
</main>

<script>
function selectSport(sport) {
  document.getElementById("selected").textContent =
    "Selected sport: " + sport;
}
</script>
</body>
</html>
